# Applies @lumina-w/dev-standards' rules/flow.json to every repo listed in
# .github/repo-sync.config.yml: branch protection (required checks, the
# up-to-date requirement, review count, deletion/force-push) and the
# repo-level merge settings. Manual only, per flow.json's own $comment
# ("nothing here runs on its own"): a person triggers it, never a schedule
# or push.
#
# Detection, not assumption. For each repo and branch this reads that
# branch's own .github/workflows/*.yml and checks which shared workflows
# (shared-ci-*.yml, shared-gitleaks.yml, shared-commitlint.yml,
# shared-pr-title.yml, shared-validate-pr-base.yml, shared-security-audit-*.yml,
# shared-codeql.yml) it actually calls. Only the required_checks whose shared
# workflow is wired up there are set as required; a branch with none wired up
# is left untouched, per flow.json's required_checks_note ("skips what it
# cannot find ... rather than leaving it permanently unmergeable"). dev, stg
# and main can be at different points in the migration, so this checks each
# branch on its own, not the repo as a whole.
#
# required_checks is per branch (since dev-standards 0.5.0): dev's list is a
# superset of stg's and main's. Each branch in the chain looks up its own
# list in flow.json instead of one shared list applying everywhere.
#
# A marker can require more than one substring (AND, not just OR between
# alternatives). shared-security-audit-node.yml's job name is templated
# (${{ inputs.package-manager }}-audit, "npm-audit" or "pnpm-audit"), so
# "audit / npm-audit" also requires the literal "package-manager: npm" in the
# workflow text, and "audit / pnpm-audit" (since dev-standards 0.6.0)
# requires "package-manager: pnpm"; matching on the filename alone would
# true-positive both contexts for every caller regardless of which package
# manager it actually passes. Of the Node repos this manages, only
# terracore-page is a pnpm caller today (okroot-page and terracore-front are
# npm); verify against the repo's own workflow before assuming either way.
# pip-audit, bandit and analyze have one fixed job name regardless of input,
# so a filename-only marker is unambiguous for them.
#
# Add, never replace a check flow.json has never heard of. Before writing
# required_status_checks, this reads the branch's current protection and
# keeps any check already required there whose name is not one of the
# check contexts flow.json can ever produce (SHARED_MARKERS' keys): a
# repo's own native CI, before it migrates to a shared-ci-*.yml. A check
# that IS one of those contexts, but is not in THIS branch's list in the
# fetched flow.json, is dropped instead of kept: flow.json is the single
# source for every check it manages, so a branch it stops requiring a
# check for (stg and main no longer require pr-title, commitlint or
# gitleaks, since dev-standards 0.5.0) actually loses it here, rather than
# it lingering forever as "kept" from before that change.
#
# dry_run defaults to true. A dry run never calls a write API: it only
# prints, per repo and branch, the exact protection payload it would send,
# or why a branch was skipped. Review that output before a real run, and
# scope `repos` to one repo for the first one.
#
# required_approving_review_count: 0 (every branch, today) is read as "do
# not send required_pull_request_reviews at all", not as sending 0 to the
# API, which the classic branch protection endpoint may reject. If
# dev-standards ever raises a count above 0, this starts sending the object.
# enforce_admins is not in flow.json; this always sends false, since no
# branch asks for an administrator override.

name: Sync branch protection from dev-standards

on:
  workflow_dispatch:
    inputs:
      dev_standards_ref:
        description: Tag of lumina-w/dev-standards to read rules/flow.json from
        type: string
        default: v0.6.0
      repos:
        description: Comma-separated subset of .github/repo-sync.config.yml (empty = all)
        type: string
        default: ''
      dry_run:
        description: Print the plan only; no branch protection or repo settings are changed
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: repo-sync
  cancel-in-progress: false

jobs:
  sync:
    name: repo-sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate secret
        env:
          TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::BRANCH_PROTECTION_TOKEN is not set. See README.md, 'repo-sync.yml' for what it needs."
            exit 1
          fi

      - name: Check out agents
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve target repos
        id: repos
        env:
          OVERRIDE: ${{ inputs.repos }}
        run: |
          set -euo pipefail
          yq -o=json '.repos' .github/repo-sync.config.yml > "$RUNNER_TEMP/all-repos.json"
          if [ -n "$OVERRIDE" ]; then
            jq -Rc '[split(",")[] | gsub("^\\s+|\\s+$";"") | select(length > 0)]' <<<"$OVERRIDE" > "$RUNNER_TEMP/wanted.json"
            unknown=$(jq -n --slurpfile all "$RUNNER_TEMP/all-repos.json" --slurpfile w "$RUNNER_TEMP/wanted.json" '$w[0] - $all[0]')
            if [ "$(jq 'length' <<<"$unknown")" -gt 0 ]; then
              echo "::error::not in .github/repo-sync.config.yml: $(jq -c . <<<"$unknown")"
              exit 1
            fi
            cp "$RUNNER_TEMP/wanted.json" "$RUNNER_TEMP/target-repos.json"
          else
            cp "$RUNNER_TEMP/all-repos.json" "$RUNNER_TEMP/target-repos.json"
          fi
          echo "Targets: $(jq -c . "$RUNNER_TEMP/target-repos.json")"

      - name: Fetch flow.json from dev-standards
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          REF: ${{ inputs.dev_standards_ref }}
        run: |
          set -euo pipefail
          gh api "repos/lumina-w/dev-standards/contents/rules/flow.json?ref=$REF" --jq '.content' \
            | base64 -d > "$RUNNER_TEMP/flow.json"
          jq . "$RUNNER_TEMP/flow.json" > /dev/null

      - name: Plan and apply
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess, sys

          RUNNER_TEMP = os.environ["RUNNER_TEMP"]
          DRY_RUN = os.environ["DRY_RUN"] == "true"
          ORG = "lumina-w"

          flow = json.load(open(f"{RUNNER_TEMP}/flow.json"))
          targets = json.load(open(f"{RUNNER_TEMP}/target-repos.json"))
          chain = flow["chain"]
          branches_cfg = flow["branches"]
          required_checks_by_branch = flow["required_checks"]
          repo_settings = flow["repo_settings"]
          all_methods = {m for ms in repo_settings["allowed_merge_methods"].values() for m in ms}

          # Which shared workflow, if called anywhere in a branch's
          # .github/workflows/*.yml, satisfies each required check context.
          # Each value is a tuple of alternatives (OR); each alternative is
          # itself a tuple of substrings that must ALL be present (AND). A
          # single-element alternative behaves like a plain filename check.
          SHARED_MARKERS = {
              "pr-title / PR title (Conventional Commits)": (("shared-pr-title.yml",),),
              "validate-base / PR base must follow dev -> stg -> main": (("shared-validate-pr-base.yml",),),
              "commitlint / Conventional Commits": (("shared-commitlint.yml",),),
              "gitleaks / Secret scan (gitleaks)": (("shared-gitleaks.yml",),),
              "ci / gate": (("shared-ci-django.yml",), ("shared-ci-vite-react.yml",), ("shared-ci-astro.yml",)),
              "audit / pip-audit": (("shared-security-audit-python.yml",),),
              "audit / bandit": (("shared-security-audit-python.yml",),),
              # AND, not just filename: the job name is
              # ${{ inputs.package-manager }}-audit, so the filename alone
              # also matches the other package manager's caller (see the
              # header comment).
              "audit / npm-audit": (("shared-security-audit-node.yml", "package-manager: npm"),),
              "audit / pnpm-audit": (("shared-security-audit-node.yml", "package-manager: pnpm"),),
              "analyze / analyze": (("shared-codeql.yml",),),
          }

          def check_matches(check, text):
              return any(all(s in text for s in alt) for alt in SHARED_MARKERS[check])

          def gh_api(path, method=None, input_json=None, ok404=False):
              cmd = ["gh", "api", path]
              if method:
                  cmd += ["--method", method]
              if input_json is not None:
                  cmd += ["--input", "-"]
              if input_json is not None:
                  proc = subprocess.run(cmd, input=json.dumps(input_json), capture_output=True, text=True)
              else:
                  proc = subprocess.run(cmd, stdin=subprocess.DEVNULL, capture_output=True, text=True)
              if proc.returncode != 0:
                  if ok404 and "HTTP 404" in proc.stderr:
                      return None
                  raise RuntimeError(proc.stderr.strip() or f"gh api {path} failed")
              return json.loads(proc.stdout) if proc.stdout.strip() else None

          def workflow_text(repo, branch):
              entries = gh_api(f"repos/{ORG}/{repo}/contents/.github/workflows?ref={branch}", ok404=True)
              if not entries:
                  return ""
              parts = []
              for entry in entries:
                  if entry.get("type") != "file" or not entry["name"].endswith((".yml", ".yaml")):
                      continue
                  blob = gh_api(f"repos/{ORG}/{repo}/contents/{entry['path']}?ref={branch}", ok404=True)
                  if blob and blob.get("content"):
                      parts.append(base64.b64decode(blob["content"]).decode("utf-8", "replace"))
              return "\n".join(parts)

          rows, errors = [], []

          for repo in targets:
              repo_patch = {
                  "delete_branch_on_merge": repo_settings["delete_head_branches_on_merge"],
                  "allow_squash_merge": "squash" in all_methods,
                  "allow_merge_commit": "merge" in all_methods,
                  "allow_rebase_merge": "rebase" in all_methods,
              }
              action = "dry-run" if DRY_RUN else "applied"
              if not DRY_RUN:
                  try:
                      gh_api(f"repos/{ORG}/{repo}", method="PATCH", input_json=repo_patch)
                  except RuntimeError as e:
                      errors.append(f"{repo}: repo settings: {e}")
                      action = f"error: {e}"
              rows.append({"repo": repo, "branch": "(repo settings)", "action": action, "detail": json.dumps(repo_patch)})

              for branch in chain:
                  cfg = branches_cfg[branch]
                  required_checks = required_checks_by_branch[branch]
                  try:
                      text = workflow_text(repo, branch)
                  except RuntimeError as e:
                      errors.append(f"{repo}@{branch}: {e}")
                      rows.append({"repo": repo, "branch": branch, "action": f"error: {e}", "detail": ""})
                      continue

                  matched, missing = [], []
                  for check in required_checks:
                      (matched if check_matches(check, text) else missing).append(check)

                  if not matched:
                      rows.append({
                          "repo": repo, "branch": branch,
                          "action": "skipped (no shared workflow wired up yet)",
                          "detail": f"missing: {', '.join(missing)}",
                      })
                      continue

                  # Keep a check this repo already requires only if flow.json
                  # has never heard of it (a repo's own native CI, before it
                  # migrates to a shared-ci-*.yml). A check flow.json DOES
                  # manage, but that is not in this branch's list, is dropped:
                  # flow.json is the single source for every context it can
                  # produce, so a branch that stops requiring a managed check
                  # actually loses it, instead of it lingering as "kept".
                  try:
                      current = gh_api(f"repos/{ORG}/{repo}/branches/{branch}/protection", ok404=True)
                  except RuntimeError as e:
                      errors.append(f"{repo}@{branch}: read current protection: {e}")
                      rows.append({"repo": repo, "branch": branch, "action": f"error: {e}", "detail": ""})
                      continue
                  existing_checks = ((current or {}).get("required_status_checks") or {}).get("checks") or []
                  kept = [c for c in existing_checks if c.get("context") not in SHARED_MARKERS]

                  payload = {
                      "required_status_checks": {
                          "strict": cfg["require_branch_up_to_date"],
                          "checks": kept + [{"context": c} for c in matched],
                      },
                      "enforce_admins": False,
                      "required_pull_request_reviews": (
                          {"required_approving_review_count": cfg["required_approving_review_count"]}
                          if cfg["required_approving_review_count"] > 0 else None
                      ),
                      "restrictions": None,
                      "allow_deletions": not cfg["restrict_deletion"],
                      "allow_force_pushes": not cfg["restrict_force_push"],
                  }
                  action = "dry-run" if DRY_RUN else "applied"
                  if not DRY_RUN:
                      try:
                          gh_api(f"repos/{ORG}/{repo}/branches/{branch}/protection", method="PUT", input_json=payload)
                      except RuntimeError as e:
                          errors.append(f"{repo}@{branch}: protection: {e}")
                          action = f"error: {e}"
                  dropped = [c.get("context", "?") for c in existing_checks if c.get("context") in SHARED_MARKERS and c.get("context") not in matched]
                  detail = f"checks: {', '.join(matched)}"
                  if dropped:
                      detail += f" | dropped (flow.json no longer requires on this branch): {', '.join(dropped)}"
                  if kept:
                      detail += f" | kept (not from flow.json): {', '.join(c.get('context', '?') for c in kept)}"
                  if missing:
                      detail += f" | not found yet: {', '.join(missing)}"
                  rows.append({"repo": repo, "branch": branch, "action": action, "detail": detail})

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"# repo-sync ({'dry run, nothing changed' if DRY_RUN else 'applied'})\n\n")
              f.write("| Repo | Branch | Action | Detail |\n|---|---|---|---|\n")
              for r in rows:
                  f.write(f"| {r['repo']} | {r['branch']} | {r['action']} | {r['detail']} |\n")

          # Also to the job log (the step summary has no REST endpoint, only
          # the run's own page), so a run's outcome can be read without a
          # browser.
          print(f"\nrepo-sync ({'dry run, nothing changed' if DRY_RUN else 'applied'})")
          for r in rows:
              print(f"{r['repo']} | {r['branch']} | {r['action']} | {r['detail']}")

          if errors:
              print("Errors:\n" + "\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY
