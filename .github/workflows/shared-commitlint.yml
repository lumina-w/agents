# Reusable workflow: lint the commits a push introduces against Conventional Commits.
# Origin: commit-lint.yml, identical in every product repo.
#
# The action compares the push event's `before` and `after` SHAs through the
# GitHub API, so older history is never re-checked. A brand-new branch has no
# `before`, and then only the commits listed in the push payload are linted.
# Rules live in the caller repo's .commitlintrc.json, the same file
# shared-pr-title.yml checks the PR title against. Callers trigger it on
# `push: branches: ['**']`.
#
# install-dependencies: true runs `npm ci` first, for a config whose `extends`
# names a package from the repo's package.json (@lumina-w/dev-standards): the
# action resolves it from the workspace node_modules. When that package is a
# private git+ssh dependency, the caller passes DEV_STANDARDS_DEPLOY_KEY.

name: Commit lint (reusable)

on:
  workflow_call:
    inputs:
      runner-label:
        type: string
        default: ''
      config-file:
        type: string
        default: .commitlintrc.json
      install-dependencies:
        type: boolean
        default: false
      node-version:
        type: string
        default: '22'
    secrets:
      DEV_STANDARDS_DEPLOY_KEY:
        required: false

permissions: {}

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ${{ startsWith(inputs.runner-label, '[') && fromJSON(inputs.runner-label) || inputs.runner-label || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: inputs.install-dependencies
        with:
          node-version: ${{ inputs.node-version }}
      # Secrets cannot be read in `if:`, so this step reports whether the key
      # was passed without printing it.
      - name: Check for the deploy key
        id: deploy-key
        if: inputs.install-dependencies
        env:
          DEPLOY_KEY: ${{ secrets.DEV_STANDARDS_DEPLOY_KEY }}
        run: echo "present=$([ -n "$DEPLOY_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: webfactory/ssh-agent@v0.10.0
        if: steps.deploy-key.outputs.present == 'true'
        with:
          ssh-private-key: ${{ secrets.DEV_STANDARDS_DEPLOY_KEY }}
      - name: Install the repo's commitlint dependencies
        if: inputs.install-dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: wagoid/commitlint-github-action@v6
        with:
          # The action falls back to config-conventional silently when this
          # file is missing, so a wrong path would not fail the job.
          configFile: ${{ inputs.config-file }}
