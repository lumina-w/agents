# Reusable workflow: Claude dev agent for any Lumina W repo.
#
# Each repo keeps only a thin .github/workflows/claude.yml that calls this
# workflow pinned to a tag and passes what is specific to the repo. The agent
# only opens or updates PRs against the base branch; merging and branch cleanup
# belong to automerge-dev.yml and delete-merged-branches.yml.
#
# Modes (picked from the event that triggered the caller):
#   implement  issue labeled dev-ft-ready (full) or dev-ft-small (smaller model)
#   iterate    comment containing @claude on a PR, by someone with write access
#   fix        the repo's CI failed on a PR opened by the agent (max 2 rounds)
#
# Layers:
#   1. Trigger guard   write access only; one run per issue/PR at a time
#   2. Toolchain       python | npm | pnpm with the repo's versions, deps preinstalled
#   3. Environment     repo env vars for local checks (never secrets)
#   4. Context         CLAUDE.md, AGENTS.md, extra repo docs, .claude/skills and the
#                      project docs repo (<project>-docs), read-only
#   5. Commands        done-criteria commands of the repo + a few extras; nothing else
#   6. Guardrails      no merge, no force push, no push to dev/stg/main, no .env reads
#   7. Feedback        waits for PR checks and fixes; CI failures re-trigger in fix mode
#   8. Checkpoint      the agent writes it to a temp file; the workflow commits it to
#                      the PR (.claude/ is a protected path for Claude's own tools)
#   9. PR text         em dashes in the PR title and body are replaced with ", "; then the
#                      draft PR is marked ready, which arms auto-merge (after the checkpoint)
#
# Secrets (org level, `secrets: inherit`):
#   CLAUDE_CODE_OAUTH_TOKEN   required
#   DOCS_SOURCES_READ_TOKEN   optional, read-only token of the org (also used by docs-sync);
#                             must include lumina-w/<project>-docs
#   PROMOTE_TOKEN             optional, pushes the checkpoint commit and marks the PR ready so the
#                             PR workflows (checks, auto-merge) run again

name: Dev agent (reusable)

on:
  workflow_call:
    inputs:
      runner-label:
        type: string
        default: ''
      toolchain:
        description: "python | npm | pnpm | none"
        type: string
        required: true
      python_version:
        type: string
        default: ""
      python_cache_path:
        description: Requirements file used as pip cache key
        type: string
        default: ""
      node_version:
        type: string
        default: ""
      node_version_file:
        description: e.g. .nvmrc (used when node_version is empty)
        type: string
        default: ""
      install_command:
        description: Installs dependencies before the agent starts, e.g. "npm ci"
        type: string
        default: ""
      env_vars:
        description: KEY=value per line for local checks (no secrets)
        type: string
        default: ""
      verify_commands:
        description: Done-criteria commands from the repo's CLAUDE.md, one per line
        type: string
        required: true
      extra_allowed_tools:
        description: Other Claude Code permission rules, one per line
        type: string
        default: ""
      context_files:
        description: Extra repo docs the agent must read besides CLAUDE.md and AGENTS.md, one per line
        type: string
        default: ""
      docs_repo:
        description: Project docs repo in the org, e.g. terracore-docs (read-only context)
        type: string
        default: ""
      checkpoint_file:
        type: string
        default: .claude/CHECKPOINT.md
      base_branch:
        type: string
        default: dev
      model:
        type: string
        default: opus
      small_model:
        description: Model for issues labeled dev-ft-small and for iterate mode
        type: string
        default: sonnet
      max_turns:
        type: number
        default: 80
      small_max_turns:
        type: number
        default: 40
      max_fix_rounds:
        type: number
        default: 2
      timeout_minutes:
        type: number
        default: 30
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      DOCS_SOURCES_READ_TOKEN:
        required: false
      PROMOTE_TOKEN:
        required: false

jobs:
  agent:
    runs-on: ${{ startsWith(inputs.runner-label, '[') && fromJSON(inputs.runner-label) || inputs.runner-label || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    concurrency:
      group: dev-agent-${{ github.repository }}-${{ github.event.issue.number || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # 1. Trigger guard + mode
      - name: Resolve mode and check permissions
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          ACTOR: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          ISSUE: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          MAX_FIX: ${{ inputs.max_fix_rounds }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          skip() { echo "$1"; out mode skip; exit 0; }
          case "$EVENT" in
            issues)
              [ "$LABEL" = "dev-ft-ready" ] || [ "$LABEL" = "dev-ft-small" ] || skip "Label $LABEL no aplica."
              mode=implement; number="$ISSUE"; size=$([ "$LABEL" = "dev-ft-small" ] && echo small || echo full)
              ;;
            issue_comment)
              [ "$IS_PR" = "true" ] || skip "El comentario no es de un PR."
              mode=iterate; number="$ISSUE"; size=small
              ;;
            workflow_run)
              [ -n "$RUN_PR" ] || skip "El CI fallido no pertenece a un PR del repo."
              mode=fix; number="$RUN_PR"; size=full; ACTOR=""
              ;;
            *) skip "Evento $EVENT no soportado." ;;
          esac
          if [ -n "$ACTOR" ]; then
            [ "$SENDER_TYPE" != "Bot" ] || skip "Disparado por un bot ($ACTOR): se ignora para evitar bucles."
            perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" -q .permission 2>/dev/null || echo none)
            case "$perm" in admin|maintain|write) ;; *) skip "$ACTOR ($perm) no puede disparar el dev agent." ;; esac
          fi
          if [ "$mode" != "implement" ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")
            [ "$(jq -r .state <<<"$pr")" = "open" ] || skip "El PR #$number no está abierto."
            [ "$(jq -r .head.repo.full_name <<<"$pr")" = "$GITHUB_REPOSITORY" ] || skip "PR desde un fork: no aplica."
            out head_ref "$(jq -r .head.ref <<<"$pr")"
            if [ "$mode" = "fix" ]; then
              labels=$(jq -r '[.labels[].name] | join(",")' <<<"$pr")
              grep -q 'dev-agent' <<<"$labels" || skip "El PR #$number no lo abrió el dev agent."
              rounds=$(grep -o 'agent-fix-[0-9]*' <<<"$labels" | sed 's/agent-fix-//' | sort -n | tail -1 || true)
              rounds=${rounds:-0}
              if [ "$rounds" -ge "$MAX_FIX" ]; then
                gh pr comment "$number" -R "$GITHUB_REPOSITORY" --body "El CI sigue fallando después de $MAX_FIX rondas de corrección automática. Requiere revisión humana (comenta @claude con instrucciones para otra iteración)."
                skip "Límite de rondas de corrección alcanzado."
              fi
              next=$((rounds + 1))
              gh label create "agent-fix-$next" -R "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
              gh pr edit "$number" -R "$GITHUB_REPOSITORY" --add-label "agent-fix-$next"
              out fix_round "$next"
            fi
          fi
          out mode "$mode"; out number "$number"; out size "$size"
          echo "Modo $mode sobre #$number ($size)"

      - name: Checkout repository
        if: steps.mode.outputs.mode != 'skip'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.mode.outputs.head_ref }}

      # 2. Toolchain
      - name: Set up Python
        if: steps.mode.outputs.mode != 'skip' && inputs.toolchain == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
          cache: ${{ inputs.python_cache_path != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.python_cache_path }}

      - name: Set up pnpm
        if: steps.mode.outputs.mode != 'skip' && inputs.toolchain == 'pnpm'
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        if: steps.mode.outputs.mode != 'skip' && (inputs.toolchain == 'npm' || inputs.toolchain == 'pnpm')
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          node-version-file: ${{ inputs.node_version == '' && inputs.node_version_file || '' }}
          cache: ${{ inputs.toolchain }}

      # 3. Environment
      - name: Export repo env vars
        if: steps.mode.outputs.mode != 'skip' && inputs.env_vars != ''
        env:
          ENV_VARS: ${{ inputs.env_vars }}
        run: printf '%s\n' "$ENV_VARS" | sed 's/^[[:space:]]*//' | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' >> "$GITHUB_ENV"

      - name: Install dependencies
        if: steps.mode.outputs.mode != 'skip' && inputs.install_command != ''
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: bash -c "$INSTALL_COMMAND"

      # 4. Project docs (read-only, outside the workspace so they can never be committed)
      - name: Fetch project docs
        id: docs
        if: steps.mode.outputs.mode != 'skip' && inputs.docs_repo != ''
        env:
          TOKEN: ${{ secrets.DOCS_SOURCES_READ_TOKEN }}
          DOCS_REPO: ${{ inputs.docs_repo }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then echo "Sin DOCS_SOURCES_READ_TOKEN: se omite el contexto de producto."; exit 0; fi
          dir="$RUNNER_TEMP/project-docs"
          git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/${DOCS_REPO}.git" "$dir"
          rm -rf "$dir/.git"
          chmod -R a-w "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # 5. Commands and context list for the prompt
      - name: Build allowlist and context
        id: prep
        if: steps.mode.outputs.mode != 'skip'
        env:
          VERIFY: ${{ inputs.verify_commands }}
          EXTRA: ${{ inputs.extra_allowed_tools }}
          CONTEXT: ${{ inputs.context_files }}
          SIZE: ${{ steps.mode.outputs.size }}
          MODE: ${{ steps.mode.outputs.mode }}
          MODEL: ${{ inputs.model }}
          SMALL_MODEL: ${{ inputs.small_model }}
          MAX_TURNS: ${{ inputs.max_turns }}
          SMALL_MAX_TURNS: ${{ inputs.small_max_turns }}
          DOCS_DIR: ${{ steps.docs.outputs.dir }}
        run: |
          set -euo pipefail
          clean() { sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' || true; }
          base='Edit
          Write
          Bash(git fetch:*)
          Bash(git checkout -b:*)
          Bash(git switch -c:*)
          Bash(git switch:*)
          Bash(git add:*)
          Bash(git mv:*)
          Bash(git commit:*)
          Bash(git push)
          Bash(git push -u origin:*)
          Bash(git push origin:*)
          Bash(git status:*)
          Bash(git diff:*)
          Bash(git log:*)
          Bash(git branch:*)
          Bash(gh issue view:*)
          Bash(gh pr create:*)
          Bash(gh pr view:*)
          Bash(gh pr diff:*)
          Bash(gh pr checks:*)
          Bash(gh pr comment:*)
          Bash(gh run view:*)'
          {
            printf '%s\n' "$base" | clean
            printf '%s\n' "$VERIFY" | clean | sed 's/.*/Bash(&)/'
            printf '%s\n' "$EXTRA" | clean
          } | awk '!seen[$0]++' | sed 's/.*/"&"/' | tr '\n' ' ' > "$RUNNER_TEMP/allowed"
          echo "allowed=$(cat "$RUNNER_TEMP/allowed")" >> "$GITHUB_OUTPUT"
          if [ "$SIZE" = "small" ]; then m="$SMALL_MODEL"; t="$SMALL_MAX_TURNS"; else m="$MODEL"; t="$MAX_TURNS"; fi
          echo "model=$m" >> "$GITHUB_OUTPUT"; echo "turns=$t" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/agent-out"
          add_dir="--add-dir $RUNNER_TEMP/agent-out"; [ -n "$DOCS_DIR" ] && add_dir="$add_dir --add-dir $DOCS_DIR"
          echo "add_dir=$add_dir" >> "$GITHUB_OUTPUT"
          {
            echo 'verify<<EOF_VERIFY'
            printf '%s\n' "$VERIFY" | clean | sed 's/.*/- `&`/'
            echo 'EOF_VERIFY'
            echo 'context<<EOF_CONTEXT'
            for f in CLAUDE.md AGENTS.md $(printf '%s\n' "$CONTEXT" | clean); do
              if [ -f "$f" ]; then echo "- \`$f\`"; fi
            done
            if [ -d .claude/skills ]; then echo "- Skills of this repo in \`.claude/skills/\` (use the ones relevant to the task)"; fi
            if [ -n "$DOCS_DIR" ]; then echo "- Project docs (read-only, product and status context): \`$DOCS_DIR\` (context, status, roadmap, design, data-model). The code is the truth if they disagree."; fi
            echo 'EOF_CONTEXT'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        if: steps.mode.outputs.mode != 'skip'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model ${{ steps.prep.outputs.model }}
            --max-turns ${{ steps.prep.outputs.turns }}
            ${{ steps.prep.outputs.add_dir }}
            --allowedTools ${{ steps.prep.outputs.allowed }}
            --disallowedTools "Bash(git push --force:*)" "Bash(git push -f:*)" "Bash(git push --force-with-lease:*)" "Bash(git push origin main:*)" "Bash(git push origin stg:*)" "Bash(git push origin dev:*)" "Bash(git push -u origin main:*)" "Bash(git push -u origin stg:*)" "Bash(git push -u origin dev:*)" "Bash(git reset --hard:*)" "Bash(gh pr merge:*)" "Read(**/.env)" "Read(**/.env.local)" "Read(**/.env.stg)" "Read(**/.env.production)"
          prompt: |
            You are the dev agent of ${{ github.repository }}. Mode: **${{ steps.mode.outputs.mode }}**.

            ## Task
            - implement: the task is issue #${{ steps.mode.outputs.number }}. Read it with `gh issue view ${{ steps.mode.outputs.number }} --comments`.
            - iterate: you are on the branch of PR #${{ steps.mode.outputs.number }}. Read the PR, its diff and the latest comments that mention @claude (`gh pr view ${{ steps.mode.outputs.number }} --comments`, `gh pr diff ${{ steps.mode.outputs.number }}`) and apply what they ask.
            - fix: you are on the branch of PR #${{ steps.mode.outputs.number }}, opened by you, and its CI failed (round ${{ steps.mode.outputs.fix_round }}). Read the failing logs (`gh pr checks ${{ steps.mode.outputs.number }}`, then `gh run view <run-id> --log-failed`) and fix the cause. Do not weaken or skip tests or checks to make them pass.
            Current mode: ${{ steps.mode.outputs.mode }}. Ignore the other two.

            ## Context (read before touching code)
            ${{ steps.prep.outputs.context }}
            The repo files define stack, versions, conventions, branch flow, commit format, PR format and done criteria. They win over any general habit. If the task contradicts them, follow them and say so in the PR.

            ## Environment
            - Toolchain `${{ inputs.toolchain }}` is set up and dependencies are installed. Do not reinstall them.
            - Do not start dev servers, watchers or anything long-running.

            ## Done criteria (the only verification commands you may run)
            ${{ steps.prep.outputs.verify }}
            Run the narrowest relevant one first while iterating. Before every push, run the full list once. Do not run anything that is not needed for this change.

            ## Flow
            1. implement: branch off an up-to-date `${{ inputs.base_branch }}` with the naming convention from CLAUDE.md. iterate/fix: stay on the PR branch, never create another one.
            2. Make the smallest change that solves the task. No unrelated refactors.
            3. Write the full updated checkpoint to `${{ runner.temp }}/agent-out/checkpoint.md`: current state, what this change did, what is pending. Start from the current `${{ inputs.checkpoint_file }}` (or `CHECKPOINT.md` at the repo root) if it exists. If `.claude/commands/checkpoint.md` exists, follow its format. Do not edit `${{ inputs.checkpoint_file }}` yourself: the workflow commits it to your PR branch after you finish. Update other repo docs only when CLAUDE.md requires it for this kind of change.
            4. Commit with the repo's commit convention and push only the working branch.
            5. implement: open a draft PR (`--draft`) against `${{ inputs.base_branch }}` with `--label dev-agent`, referencing #${{ steps.mode.outputs.number }}, with the body sections CLAUDE.md requires. Mark as done only what you ran and saw pass; list the rest under "Not verified". iterate/fix: comment on the PR what you changed and why. The workflow marks the PR ready for review after you finish; do not do it yourself.
            6. Your job ends at the PR. Merging into `${{ inputs.base_branch }}`, branch deletion and promotions are handled by the repo's workflows and people. Never merge, never push to `dev`, `stg` or `main`, never force push, never read `.env` files.
            7. If you cannot finish (missing access, unclear task, failing check outside your change), stop and explain it in a comment instead of guessing.
            8. Never use em dashes or emojis in commits, PR titles or bodies.

      # 8. Checkpoint and PR text, outside Claude
      - name: Resolve PR
        id: pr
        if: steps.mode.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.mode.outputs.head_ref }}
          BASE: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          branch="${HEAD_REF:-$(git branch --show-current)}"
          if [ -z "$branch" ] || [ "$branch" = "$BASE" ]; then echo "Sin rama de PR."; exit 0; fi
          number=$(gh pr list --head "$branch" --state open --json number -q '.[0].number // empty')
          [ -n "$number" ] || { echo "Sin PR abierto para $branch."; exit 0; }
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Commit checkpoint
        if: steps.pr.outputs.number != ''
        env:
          TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          NUMBER: ${{ steps.mode.outputs.number }}
          TARGET: ${{ inputs.checkpoint_file }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/agent-out/checkpoint.md"
          [ -s "$src" ] || { echo "El agente no escribió checkpoint."; exit 0; }
          [ -n "$TOKEN" ] || { echo "::warning::Sin PROMOTE_TOKEN: el checkpoint no se commitea."; exit 0; }
          git fetch --quiet origin "$BRANCH"
          git checkout --quiet --force -B "$BRANCH" "origin/$BRANCH"
          mkdir -p "$(dirname "$TARGET")"
          if [ ! -f "$TARGET" ] && [ -f CHECKPOINT.md ] && [ "$TARGET" != CHECKPOINT.md ]; then git mv CHECKPOINT.md "$TARGET"; fi
          cp "$src" "$TARGET"
          git add "$TARGET"
          if git diff --cached --quiet; then echo "Checkpoint sin cambios."; exit 0; fi
          git -c user.name="$(git log -1 --format=%an)" -c user.email="$(git log -1 --format=%ae)" \
            commit --quiet -m "docs(docs): update checkpoint after #$NUMBER"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # The empty value drops the checkout's own header so the push runs as PROMOTE_TOKEN
          # and triggers the PR workflows again.
          git -c http.https://github.com/.extraheader= \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --quiet origin "HEAD:refs/heads/$BRANCH"

      - name: Strip em dashes from the PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          title=$(gh pr view "$PR" --json title -q .title)
          body=$(gh pr view "$PR" --json body -q .body)
          dash=$(printf '\342\200\224')
          new_title=$(printf '%s' "$title" | sed "s/ *$dash */, /g")
          new_body=$(printf '%s\n' "$body" | sed "s/ *$dash */, /g")
          if [ "$new_title" = "$title" ] && [ "$new_body" = "$body" ]; then echo "Sin guiones largos."; exit 0; fi
          gh pr edit "$PR" --title "$new_title" --body "$new_body"

      # Last: auto-merge is only armed once the PR leaves draft, so the checkpoint lands first.
      - name: Mark ready
        if: always() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::warning::Sin PROMOTE_TOKEN: el PR #$PR queda en draft."; exit 0; }
          if [ "$(gh pr view "$PR" --json isDraft -q .isDraft)" = "true" ]; then gh pr ready "$PR"; else echo "El PR #$PR ya estaba listo."; fi

      - name: Summary
        if: always()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          NUMBER: ${{ steps.mode.outputs.number }}
          STATUS: ${{ job.status }}
        run: |
          echo "Dev agent $MODE sobre #$NUMBER terminó con estado $STATUS." >> "$GITHUB_STEP_SUMMARY"
