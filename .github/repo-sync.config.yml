# Repos that repo-sync.yml manages: the 8 product repos also listed in
# README.md's catalog and in AGENTS.md's dev agent callers, plus the four
# Kairo repos (added on 10-11-2026; no dev agent caller yet). Single source
# for the workflow; update both docs in the same PR that changes this list.
repos:
  - terracore-back
  - terracore-front
  - terracore-page
  - okroot-back
  - okroot-front
  - okroot-page
  - blog-w
  - luminaw-page
  - kairo-back
  - kairo-front
  - kairo-page
  - kairo-docs
# A repo's own jobs that flow.json does not list and that the owner wants
# required too, per branch, added to the checks repo-sync sets. Names exactly
# as GitHub shows them on a pull request. Decided by the owner on 10-11-2026.
extra_required_checks:
  kairo-back:
    dev:
      - "Types, Redis tests and coverage"
      - "Deploy scripts (shellcheck, compose config, backup and restore tests)"
